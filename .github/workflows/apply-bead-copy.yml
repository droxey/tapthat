name: apply-bead-copy
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Restore seo.ts then swap charm copy
        run: |
          set -euo pipefail
          git checkout 816bb1ee4d0812c7c7d826969ef5345af2cfdfb3 -- src/lib/seo.ts || true
          python3 <<'PY'
          from pathlib import Path
          ROOT = Path('.')
          SKIP_PARTS = {'research', 'public', 'node_modules', '.git', 'screenshots'}
          SKIP_NAMES = {'routeTree.gen.ts'}
          PROTECT = [
              ('$charmId', '[[P0]]'),
              ('charmById', '[[P1]]'),
              ('charmByCode', '[[P2]]'),
              ('isCharmPublic', '[[P3]]'),
              ('CharmPage', '[[P4]]'),
              ('export type Charm', '[[P5]]'),
              ('type Charm =', '[[P6]]'),
              ('export const charms', '[[P7]]'),
              ('const charms', '[[P8]]'),
              ('charmId', '[[P9]]'),
              ('live-charms', '[[P10]]'),
              ('how-to-wear-a-charm', '[[P11]]'),
              ('charms-10', '[[P12]]'),
              ('charms-3', '[[P13]]'),
              ('charms-5', '[[P14]]'),
              ('"charms"', '[[P15]]'),
              ("'charms'", '[[P16]]'),
          ]
          WORD = [
              ('Charms', 'Beads'),
              ('CHARMS', 'BEADS'),
              ('charms', 'beads'),
              ('Charm', 'Bead'),
              ('CHARM', 'BEAD'),
              ('charm', 'bead'),
          ]
          for p in ROOT.rglob('*'):
              if not p.is_file():
                  continue
              if any(part in SKIP_PARTS for part in p.parts):
                  continue
              if p.name in SKIP_NAMES:
                  continue
              if p.suffix not in {'.ts', '.tsx', '.json', '.md'}:
                  continue
              orig = p.read_text()
              if 'charm' not in orig.lower() and 'PLACEHOLDER' not in orig:
                  continue
              text = orig
              for a,b in PROTECT:
                  text = text.replace(a,b)
              for a,b in WORD:
                  text = text.replace(a,b)
              for a,b in reversed(PROTECT):
                  text = text.replace(b,a)
              # keep identifiers if a map leftover happened
              text = text.replace('export const charms: Bead[]', 'export const charms: Charm[]')
              text = text.replace('return beads.find', 'return charms.find')
              text = text.replace('import { BRAND, beads,', 'import { BRAND, charms,')
              text = text.replace('{beads.map((c) => (', '{charms.map((c) => (')
              if text != orig:
                  p.write_text(text)
                  print('updated', p)
          cat = Path('src/lib/catalog.ts').read_text()
          assert 'export type Charm' in cat
          assert 'charmById' in cat
          assert 'Fan Beads' in cat
          assert 'export const charms: Charm[]' in cat
          print('ok')
          PY
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "Dani Roxberry"
          git config user.email "dani@musexmachine.com"
          git add -u README.md src
          if git diff --cached --quiet; then
            echo no copy changes
            exit 0
          fi
          git commit -m "copy: beads, not charms"
          git push
