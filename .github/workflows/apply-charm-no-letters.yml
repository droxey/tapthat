name: apply-charm-no-letters
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch letter-free charm frames
        run: |
          set -euo pipefail
          curl -fsSL -o public/products/unicorn.jpg https://litter.catbox.moe/bcwfze.jpg
          curl -fsSL -o public/products/fans.jpg https://litter.catbox.moe/5oqj66.jpg
          curl -fsSL -o public/products/heart.jpg https://litter.catbox.moe/anvbym.jpg
          curl -fsSL -o public/products/live.jpg https://litter.catbox.moe/lhkkk0.jpg
          curl -fsSL -o public/images/scan.jpg https://litter.catbox.moe/zuilwd.jpg
          curl -fsSL -o public/images/tap.jpg https://litter.catbox.moe/uh83ty.jpg
          python3 - <<'PY'
          from pathlib import Path
          files = [
            'public/products/unicorn.jpg',
            'public/products/fans.jpg',
            'public/products/heart.jpg',
            'public/products/live.jpg',
            'public/images/scan.jpg',
            'public/images/tap.jpg',
          ]
          for f in files:
            data = Path(f).read_bytes()
            if data[:3] != b'\xff\xd8\xff':
              raise SystemExit(f'{f} is not a jpeg ({data[:20]!r})')
            print(f, len(data))
          PY
      - name: Commit frames
        run: |
          set -euo pipefail
          git config user.name "Dani Roxberry"
          git config user.email "dani@musexmachine.com"
          git add public/products/unicorn.jpg public/products/fans.jpg public/products/heart.jpg public/products/live.jpg public/images/scan.jpg public/images/tap.jpg
          if git diff --cached --quiet; then
            echo "no image changes"
            exit 0
          fi
          git commit -m "art: no letters on charm graphics"
          git push
